name: tripforge

on:
  push:
    branches: [main]
    paths: ["tripforge/**", ".github/workflows/tripforge.yml"]
  pull_request:
    paths: ["tripforge/**", ".github/workflows/tripforge.yml"]

defaults:
  run:
    working-directory: tripforge

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: make demo
      - uses: actions/upload-artifact@v4
        with:
          name: vietnam-sample
          path: tripforge/out/vietnam/
